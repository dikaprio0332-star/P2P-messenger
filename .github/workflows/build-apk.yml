name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    # ubuntu-22.04 — специально не ubuntu-latest: на 24.04 у части системных
    # пакетов python-for-android (например libtinfo5) нет пакета в репозиториях.
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Распаковать проект (p2p_messenger_ready.zip -> p2p_messenger/)
        run: unzip -o p2p_messenger_ready.zip -d .

      - name: Настроить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Системные зависимости python-for-android
        # libtinfo5/libncurses5 — это и есть тот самый пакет, из-за отсутствия
        # которого на Ubuntu 24.04 выбран runs-on: ubuntu-22.04 (см. коммент
        # выше). Но раньше он был упомянут только в комментарии и не ставился
        # реальной командой — из-за этого p4a падал с "Aidl не найден" /
        # "libtinfo.so.5: cannot open shared object file", т.к. прекомпилированные
        # бинарники Android SDK (aidl, aapt2 и т.п.) слинкованы со старым
        # libtinfo.so.5/libncurses.so.5, которого нет в системе по умолчанию.
        # lib32stdc++6/lib32z1 добавлены на случай использования 32-битных
        # прекомпилированных инструментов SDK.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev libncursesw5-dev libtinfo-dev \
            libtinfo5 libncurses5 lib32stdc++6 lib32z1 \
            cmake libffi-dev libssl-dev build-essential ccache

      - name: Установить Buildozer
        # Версия python-for-android фиксируется НЕ здесь, а в buildozer.spec
        # через p4a.branch = v2024.01.21 (git-тег) — buildozer всё равно
        # игнорирует то, что поставлено тут через pip, и либо клонирует
        # версию из p4a.branch, либо (если его нет) тянет свою dev-версию.
        # Поэтому здесь пинуем только сам buildozer и cython.
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cython<3.1" "buildozer==1.5.0"

      - name: Собрать APK
        working-directory: p2p_messenger
        run: buildozer -v android debug

      - name: Загрузить готовый APK
        uses: actions/upload-artifact@v4
        with:
          name: wire-p2p-apk
          path: p2p_messenger/bin/*.apk  
