name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    # ubuntu-22.04 — специально не ubuntu-latest: на 24.04 у части системных
    # пакетов python-for-android (например libtinfo5) нет пакета в репозиториях.
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Распаковать проект (p2p_messenger_ready.zip -> .)
        # ВАЖНО: buildozer.spec, main.py, requirements.txt лежат в КОРНЕ
        # zip-архива (не внутри подпапки p2p_messenger/ — там только сам
        # Python-пакет). "-d ." кладёт их прямо в корень воркспейса, поэтому
        # шаг сборки ниже запускается БЕЗ working-directory (см. коммент там).
        run: unzip -o p2p_messenger_ready.zip -d .

      - name: Настроить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Системные зависимости python-for-android
        # libtinfo5/libncurses5 — это и есть тот самый пакет, из-за отсутствия
        # которого на Ubuntu 24.04 выбран runs-on: ubuntu-22.04 (см. коммент
        # выше). Но раньше он был упомянут только в комментарии и не ставился
        # реальной командой — из-за этого p4a падал с "Aidl не найден" /
        # "libtinfo.so.5: cannot open shared object file", т.к. прекомпилированные
        # бинарники Android SDK (aidl, aapt2 и т.п.) слинкованы со старым
        # libtinfo.so.5/libncurses.so.5, которого нет в системе по умолчанию.
        # lib32stdc++6/lib32z1 добавлены на случай использования 32-битных
        # прекомпилированных инструментов SDK.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev libncursesw5-dev libtinfo-dev \
            libtinfo5 libncurses5 lib32stdc++6 lib32z1 \
            cmake libffi-dev libssl-dev build-essential ccache

      - name: Установить Buildozer
        # Версия python-for-android фиксируется НЕ здесь, а в buildozer.spec
        # через p4a.branch = v2024.01.21 (git-тег) — buildozer всё равно
        # игнорирует то, что поставлено тут через pip, и либо клонирует
        # версию из p4a.branch, либо (если его нет) тянет свою dev-версию.
        # Поэтому здесь пинуем только сам buildozer и cython.
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cython<3.1" "buildozer==1.5.0"

      - name: Настроить JAVA_HOME на Java 17
        # apt-get install openjdk-17-jdk кладёт JDK 17 на диск, но НЕ меняет
        # JAVA_HOME — на раннере он по умолчанию указывает на Java 11
        # (/usr/lib/jvm/temurin-11-jdk-amd64). Android Gradle Plugin требует
        # Java 17+, поэтому сборка падала на шаге gradlew assembleDebug с
        # ошибкой "Android Gradle plugin requires Java 17 to run. You are
        # currently using Java 11." Явно переключаем JAVA_HOME на
        # предустановленный на раннере Temurin 17 (тот же дистрибутив, что
        # ставит apt-get openjdk-17-jdk) и добавляем его bin в PATH для всех
        # последующих шагов джобы.
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"

      - name: Собрать APK
        # БЕЗ working-directory: buildozer.spec лежит в корне воркспейса
        # (см. коммент к шагу распаковки выше), а не в p2p_messenger/ —
        # именно working-directory: p2p_messenger и был источником ошибки
        # "No buildozer.spec found in the current directory. Abandon."
        run: buildozer -v android debug

      - name: Загрузить готовый APK
        uses: actions/upload-artifact@v4
        with:
          name: wire-p2p-apk
          # buildozer кладёт результат в ./bin относительно buildozer.spec,
          # т.е. в корень воркспейса (см. коммент выше) — не p2p_messenger/bin.
          path: bin/*.apk  
