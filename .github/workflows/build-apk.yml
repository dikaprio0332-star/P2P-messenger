name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Распаковать проект (p2p_messenger_ready.zip -> p2p_messenger/)
        run: unzip -o p2p_messenger_ready.zip -d .

      - name: Собрать APK через Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          workdir: p2p_messenger
          buildozer_version: 1.5.0

      - name: Загрузить готовый APK
        uses: actions/upload-artifact@v4
        with:
          name: wire-p2p-apk
          path: ${{ steps.buildozer.outputs.filename }}
