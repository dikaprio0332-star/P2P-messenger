name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    # ubuntu-22.04 — специально не ubuntu-latest: на 24.04 у части системных
    # пакетов python-for-android (например libtinfo5) нет пакета в репозиториях.
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Распаковать проект (p2p_messenger_ready.zip -> p2p_messenger/)
        run: unzip -o p2p_messenger_ready.zip -d .

      - name: Настроить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Системные зависимости python-for-android
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev libncursesw5-dev libtinfo-dev \
            cmake libffi-dev libssl-dev build-essential ccache

      - name: Установить Buildozer (закреплённые стабильные версии)
        # Последний официальный релиз python-for-android на PyPI — 2024.1.21
        # (январь 2024). Всё, что новее (поддержка Python 3.14, новый
        # экспериментальный механизм установки пакетов через бинарные wheel'ы),
        # существует только в нестабильной ветке разработки на GitHub и ещё
        # плохо работает с пакетами вроде cryptography/cffi. Фиксируем версии,
        # чтобы buildozer не тянул её по умолчанию.
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cython<3.1" "buildozer==1.5.0" "python-for-android==2024.1.21"

      - name: Собрать APK
        working-directory: p2p_messenger
        run: buildozer -v android debug

      - name: Загрузить готовый APK
        uses: actions/upload-artifact@v4
        with:
          name: wire-p2p-apk
          path: p2p_messenger/bin/*.apk
